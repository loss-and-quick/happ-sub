name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      - name: Nix flake check
        run: nix flake check --print-build-logs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features url-crypt -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features device -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features happ-request -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features incy-crypt -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features incy-request,incy-signers -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features url-crypt"
          - "--no-default-features --features builtin-url-keys"
          - "--no-default-features --features device"
          - "--no-default-features --features incy-crypt"
          - "--no-default-features --features builtin-incy-keys"
          - "--no-default-features --features incy-request"
          - "--no-default-features --features incy-signers"
          - "--no-default-features --features happ-request"
          - "--no-default-features --features incy-request,incy-signers"
          - "--all-features"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - run: cargo test ${{ matrix.features }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.80.0
      # Resolve dependencies that still support `rust-version`, as a downstream user would get.
      - run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - run: cargo +1.80.0 test --all-features --no-run
      - run: cargo +1.80.0 check --no-default-features
